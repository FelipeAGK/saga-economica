baseURL = 'http://localhost:1313/'
locale = 'es-co'
defaultContentLanguage = 'es'
title = 'Saga Económica'
enableRobotsTXT = true

[params]
  descripcion = 'Análisis de la economía colombiana a partir de las cifras oficiales: fuentes primarias, series completas y el método a la vista.'
  lema = 'Análisis profundo más allá de la viralidad'
  ciudad = 'Bogotá'
  correo = 'lasagaeconomica@gmail.com'
  mainSections = ['analisis', 'boletin', 'datos', 'video', 'cultura']

  # Suscripción (boletín por correo) y apoyo (financiación). El botón del encabezado
  # y el pie los leen de aquí; la página /apoyar/ explica las dos.
  suscripcion = 'https://substack.com/@angelicamgomez'

  [params.apoyo]
    texto = 'Apoyar'
    url = '/apoyar/'
    # Link de pago de Wompi (monto abierto). Vacío = el botón de aportar no se pinta.
    wompi = ''

  [params.redes]
    instagram = 'https://www.instagram.com/sagaeconomica/'
    tiktok = 'https://www.tiktok.com/@saga_economica'
    youtube = 'https://www.youtube.com/@angelicamgomezb'
    substack = 'https://substack.com/@angelicamgomez'
    linkedin = 'https://www.linkedin.com/in/angelica-maria-gomez/'

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser.attribute]
    block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[[menu.main]]
  name = 'Análisis'
  url = '/analisis/'
  weight = 1

