baseURL = 'http://localhost:1313/'
locale = 'es-co'
defaultContentLanguage = 'es'
title = 'Saga Económica'
enableRobotsTXT = true
# Rutas solo ASCII: una etiqueta con acento o ñ no produce URL con acento (22-nov, auditoría prepublicación).
removePathAccents = true

[params]
  descripcion = 'Análisis de la economía colombiana a partir de las cifras oficiales: fuentes primarias, series completas y el método a la vista.'
  lema = 'Análisis profundo más allá de la viralidad'
  ciudad = 'Bogotá'
  correo = 'lasagaeconomica@gmail.com'
  mainSections = ['analisis', 'boletin', 'datos', 'video', 'cultura']

  # Suscripción (boletín por correo) y apoyo (financiación). El botón del encabezado
  # y el pie los leen de aquí; la página /apoyar/ explica las dos.
  # Publicación de Substack desde la que sale el boletín. El shortcode {{< suscribir >}}
  # incrusta su formulario (/embed) para que el lector se suscriba sin salir de Saga.
  suscripcion = 'https://angelicamgomez.substack.com'
  # Imagen única de las columnas de opinión e invitados (portada y bloque de análisis). S7: propia.
  imagen_opinion = '/img/opinion.jpg'

  # Listas de reproducción de YouTube. Un video se cuelga de una con lista = 'clave'.
  [params.listas]
    [params.listas.verdad]
      titulo = 'La verdad sobre la economía de Colombia'
      youtube = 'PLIf1tsltAjMU'
      nota = 'Miniserie de documentales cortos sobre la deuda, los precios, la vivienda y las pensiones.'

  [params.apoyo]
    texto = 'Apoyar'
    url = '/apoyar/'
    # Link de pago de Wompi (monto abierto). Vacío = el botón de aportar no se pinta.
    wompi = 'https://checkout.wompi.co/l/VPOS_VVXgmV'

  [params.redes]
    instagram = 'https://www.instagram.com/sagaeconomica/'
    tiktok = 'https://www.tiktok.com/@saga_economica'
    youtube = 'https://www.youtube.com/@angelicamgomezb'
    substack = 'https://substack.com/@angelicamgomez'

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser.attribute]
    block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[[menu.main]]
  name = 'Análisis'
  url = '/analisis/'
  weight = 1

[[menu.main]]
  name = 'Boletín'
  url = '/boletin/'
  weight = 2

[[menu.main]]
  name = 'Datos'
  url = '/datos/'
  weight = 3

[[menu.main]]
  name = 'Video'
  url = '/video/'
  weight = 4

[[menu.main]]
  name = 'Cultura'
  url = '/cultura/'
  weight = 5

[[menu.main]]
  name = 'Acerca de'
  url = '/acerca/'
  weight = 6
