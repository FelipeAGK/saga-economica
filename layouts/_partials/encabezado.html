<header class="cabecera">
  <div class="cabecera__interior">
    <a class="marca" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, inicio">
      <img class="marca__isotipo" src="{{ "img/saga-isotipo.svg" | relURL }}" alt="" width="40" height="40">
      <span class="marca__nombre"><span class="marca__saga">SAGA</span><span class="marca__economica">ECONÓMICA</span></span>
    </a>
    <nav class="menu" aria-label="Secciones">
      {{- $actual := . }}
      {{- range site.Menus.main }}
      {{- $activo := or ($actual.IsMenuCurrent "main" .) ($actual.HasMenuCurrent "main" .) (eq $actual.Section (trim .URL "/")) }}
      <a href="{{ .URL }}"{{ if $activo }} class="activo" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    {{- with site.Params.apoyo }}
    <a class="cabecera__apoyo" href="{{ .url | relURL }}">{{ .texto }}</a>
    {{- end }}
  </div>
</header>
