{{ define "main" }}
<section class="listado">
  <div class="listado__interior">
    <header class="listado__cabecera">
      <h1 class="listado__titulo">{{ .Title }}</h1>
      {{- with .Content }}<div class="prosa">{{ . }}</div>{{ end }}
    </header>
    <ul class="etiquetas">
      {{- range .Pages.ByTitle }}
      <li><a class="etiqueta" href="{{ .RelPermalink }}">{{ .LinkTitle }} <span>{{ len .Pages }}</span></a></li>
      {{- end }}
    </ul>
  </div>
</section>
{{ end }}
