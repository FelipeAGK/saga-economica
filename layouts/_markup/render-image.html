{{- /* Toda imagen del Markdown sale como figura encuadrada; el texto alt se
       vuelve pie de figura. Los recursos del bundle se resuelven por nombre. */ -}}
{{- $src := .Destination }}
{{- with .Page.Resources.Get .Destination }}{{ $src = .RelPermalink }}{{ end }}
<figure class="figura">
  <img src="{{ $src }}" alt="{{ .Text }}" loading="lazy">
  {{- with .Text }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
