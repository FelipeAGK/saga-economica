    .brecha { fill: #9aa0a6; opacity: 0.18; }
    .barraN { fill: #d93025; }
    .barraP { fill: #188038; }
    .nomA   { fill: #1a73e8; font: 600 13px -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
    .nomB   { fill: #d93025; font: 600 13px -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .eje    { stroke: #6b7076; }
      .guia   { stroke: #3c4043; }
      .rotulo, .sub { fill: #9aa0a6; }
      .titulo { fill: #e8eaed; }
      .serieA { stroke: #8ab4f8; }
      .serieB { stroke: #f28b82; }
      .brecha { fill: #9aa0a6; opacity: 0.22; }
      .barraN { fill: #f28b82; }
      .barraP { fill: #81c995; }
      .nomA   { fill: #8ab4f8; }
      .nomB   { fill: #f28b82; }
    }
