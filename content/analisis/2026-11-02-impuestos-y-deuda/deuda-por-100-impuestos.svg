<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Pesos de deuda recibidos por cada 100 pesos de impuestos, 2019 a 2026">
  <style>
    .eje    { stroke: #8B82A3; stroke-width: 1; }
    .guia   { stroke: #E6E0F7; stroke-width: 1; stroke-dasharray: 3 3; }
    .rotulo { fill: #4A4458; font: 13px Inter, 'Segoe UI', system-ui, sans-serif; }
    .titulo { fill: #0F0A1E; font: 600 17px Inter, 'Segoe UI', system-ui, sans-serif; }
    .sub    { fill: #4A4458; font: 13px Inter, 'Segoe UI', system-ui, sans-serif; }
    .serieA { stroke: #7C3AED; stroke-width: 2.8; fill: none;
              stroke-linejoin: round; stroke-linecap: round; }
    .serieB { stroke: #0F0A1E; stroke-width: 2.4; fill: none;
              stroke-linejoin: round; stroke-linecap: round; }
    .puntoA { fill: #7C3AED; stroke: #FFFFFF; stroke-width: 2; }
    .puntoB { fill: #0F0A1E; stroke: #FFFFFF; stroke-width: 2; }
    .brecha { fill: #C4B5FD; opacity: 0.28; }
    .barraN { fill: #7C3AED; }
    .barraP { fill: #0F0A1E; }
    .barraS { fill: #C4B5FD; }
    .valor  { fill: #0F0A1E; font: 600 13px Inter, 'Segoe UI', system-ui, sans-serif; }
    .nomA   { fill: #6D28D9; font: 600 13px Inter, 'Segoe UI', system-ui, sans-serif; }
    .nomB   { fill: #0F0A1E; font: 600 13px Inter, 'Segoe UI', system-ui, sans-serif; }
  </style>
<text class="titulo" x="52" y="30">Pesos de deuda por cada 100 de impuestos</text>
<text class="sub" x="52" y="50">Crédito desembolsado / recaudo tributario neto · Nación</text>
<line class="guia" x1="52" y1="394.0" x2="734" y2="394.0"/>
