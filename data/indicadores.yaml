# Franja de indicadores (parcial layouts/_partials/franja.html).
# Se actualiza a mano. Regla: ninguna cifra sin `corte` y sin `fuente`.
# Una entrada sin `valor` no se muestra; así la franja nunca enseña un dato viejo por descuido.
#
# valor:      la cifra tal como debe leerse, con unidad ("4.102", "4,9 %", "US$ 72,4")
# variacion:  texto corto ("0,3 %", "0,1 pp", "sin cambio"); vacío si no aplica
# sentido:    sube | baja | igual  (dibuja la flecha; vacío = sin flecha)
# corte:      fecha o período del dato ("3 nov 2026", "sep 2026", "2025")
# fuente:     quién publica la cifra (se muestra)
# enlace:     a dónde lleva el clic (la fuente o la serie en /datos/)

indicadores:
  - clave: trm
    nombre: TRM
    valor: "$ 3.182,99"
    variacion: ""
    sentido: ""
    corte: "3 nov 2026"
    fuente: Banco de la República
    enlace: https://www.banrep.gov.co/es/estadisticas/trm

