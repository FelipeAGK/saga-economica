# Glosario de Saga Económica.
# Una entrada por término. La clave (minúsculas-con-guiones) es el ancla en
# /glosario/ y lo que se escribe en el shortcode: {{< termino "gasto-primario" />}}.
# Regla: un término entra cuando un análisis publicado lo usa; `origen` dice cuál.
#
# termino:     cómo se escribe, con tildes y mayúsculas
# corta:       una línea; aparece al pasar el cursor sobre el término en un artículo
# definicion:  el párrafo completo de la página del glosario
# en_colombia: la cifra que lo aterriza (opcional)
# origen:      ruta de la pieza que lo introdujo
# ver:         claves de términos relacionados (opcional)

gnc:
  termino: Gobierno Nacional Central (GNC)
  corta: Los ministerios y entidades nacionales que se financian con el Presupuesto General de la Nación.
  definicion: >-
    Es el núcleo del Estado en el nivel nacional: los ministerios, los
    departamentos administrativos y las entidades nacionales que se financian
    con el Presupuesto General de la Nación. No incluye a departamentos y
    municipios, a las empresas públicas ni al sistema de seguridad social, que
    llevan cuentas propias. Cuando se habla del déficit o de la deuda «del
    Gobierno», casi siempre se habla del GNC.
  en_colombia: Su deuda bruta pasó de 32,7 % del PIB en 2012 a 62,9 % en 2025.
  origen: /analisis/ingresos-y-gasto-gnc/
  ver: [gasto-primario, balance-primario]

gasto-primario:
  termino: Gasto primario
  corta: Todo lo que gasta el Gobierno, menos los intereses de la deuda.
  definicion: >-
    Es el gasto total menos lo que se paga en intereses de la deuda. Separa
    las decisiones del presente —nómina, transferencias, inversión,
    subsidios— del costo de las deudas del pasado. Por eso es la medida más
    directa de cuánto decide gastar un gobierno en un año dado.
  en_colombia: 19,9 % del PIB en 2025, frente a 14,6 % en 2005.
  origen: /analisis/ingresos-y-gasto-gnc/
  ver: [balance-primario, gnc]

balance-primario:
  termino: Balance primario
  corta: Ingresos menos gasto primario. Dice si el Gobierno cubre su gasto antes de pagar intereses.
  definicion: >-
    Es la diferencia entre lo que el Gobierno recibe y su gasto primario. Si es
    positivo (superávit primario), los ingresos alcanzan para todo el gasto
    corriente y sobra algo para pagar intereses. Si es negativo (déficit
    primario), el Gobierno se endeuda incluso antes de contar el costo de la
    deuda que ya tiene. Es el indicador que más se mira para saber si una
    deuda pública es sostenible.
  en_colombia: Fue de −3,6 % del PIB en 2025, el sexto año seguido en déficit.
  origen: /analisis/ingresos-y-gasto-gnc/
  ver: [gasto-primario]

metodologia-de-caja:
  termino: Metodología de caja
  corta: Registra una operación cuando el dinero efectivamente entra o sale.
  definicion: >-
    Es una forma de llevar las cuentas públicas que anota cada ingreso o gasto
    en el momento en que la plata se mueve. Es útil para seguir la liquidez
    del Gobierno mes a mes, pero puede mostrar saltos que no reflejan
    decisiones de fondo: un pago atrasado, un adelanto o una operación de
    tesorería mueven la cifra del mes aunque no cambien la obligación.
  origen: /analisis/ingresos-y-gasto-gnc/
  ver: [causacion]

causacion:
  termino: Causación
  corta: Registra una operación cuando nace la obligación o el derecho, aunque el pago llegue después.
  definicion: >-
    Es la forma de llevar las cuentas que anota un ingreso o un gasto cuando
    se genera, no cuando se paga. Unos intereses se «causan» a medida que
    corre el tiempo, aunque se paguen al vencimiento. Por eso las cifras
    oficiales para evaluar la sostenibilidad de la deuda usan causación: miden
    el costo real del periodo, sin el ruido de las fechas de pago.
  origen: /analisis/ingresos-y-gasto-gnc/
  ver: [metodologia-de-caja]

pesos-constantes:
  termino: Pesos constantes
  corta: "Cifras de distintos años llevadas a los precios de un solo año, para que se puedan comparar."
  definicion: >-
    Un peso de 2019 compraba más que un peso de 2025. Para comparar cifras de
    años distintos se convierten todas a los precios de un mismo año, usando
    el índice de precios al consumidor como regla de conversión. El resultado
    se llama pesos constantes, o pesos «de 2025» si ese es el año elegido. Lo
    contrario son los pesos corrientes: la cifra tal como se registró cada año,
    que mezcla crecimiento real con inflación.
  en_colombia: "En pesos de 2025, el recaudo tributario de 2023 fue de 295 billones y el de 2025, de 272."
  origen: /analisis/impuestos-y-deuda-2019-2026/

recursos-de-credito:
  termino: Recursos de crédito
  corta: "Lo que la Nación recibe cuando se endeuda, por dentro o por fuera del país."
  definicion: >-
    Es el dinero que entra a la Tesorería por deuda nueva. El crédito interno
    es sobre todo la venta de TES, los títulos de deuda pública que compran los
    bancos, los fondos de pensiones y otros inversionistas en Colombia. El
    crédito externo son los préstamos de la banca multilateral y los bonos
    emitidos en el exterior. El presupuesto los registra como ingresos, aunque
    haya que devolverlos, porque con ellos se paga gasto del año.
  en_colombia: "129 billones en 2025, de los cuales 86 de crédito interno; en 2024 habían sido 75."
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [recursos-de-capital, regla-fiscal]

recursos-de-capital:
  termino: Recursos de capital
  corta: "Los ingresos de la Nación que no son impuestos ni contribuciones: deuda, dividendos, excedentes, reintegros."
  definicion: >-
    Es la segunda gran rama de los ingresos del presupuesto, después de los
    ingresos corrientes. Agrupa el crédito interno y externo, los dividendos
    de las empresas en que la Nación tiene acciones (Ecopetrol, ante todo),
    los excedentes de los establecimientos públicos, los rendimientos
    financieros, los reintegros y la venta de activos. Como el crédito es la
    mayor parte, cuando los recursos de capital crecen suele ser porque la
    Nación se endeudó más.
  en_colombia: "155 billones en 2025; el crédito fue 129 de ellos y los dividendos, 19."
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [recursos-de-credito]

recaudo-bruto:
  termino: Recaudo bruto y neto
  corta: "Bruto es todo lo que se paga en impuestos; neto, lo que queda después de las devoluciones."
  definicion: >-
    El recaudo bruto es la suma de lo que los contribuyentes pagan en impuestos
    en un periodo. Una parte vuelve a ellos: saldos a favor, devoluciones de
    IVA a exportadores, pagos en exceso. Lo que queda después de restar esas
    devoluciones es el recaudo neto. La DIAN publica su serie en bruto y cuenta
    tanto el efectivo como los pagos con títulos; el presupuesto registra lo
    que entra a la Tesorería. Por eso las dos fuentes no dan la misma cifra, y
    la diferencia entre ambas es estable, de 4 a 7 por ciento al año.
  en_colombia: "294,5 billones brutos en 2025 según la DIAN; 272 netos en caja según el presupuesto."
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [tidis, metodologia-de-caja]

tidis:
  termino: TIDIS
  corta: "Títulos con los que la DIAN devuelve impuestos y que sirven para pagar otros impuestos."
  definicion: >-
    Los Títulos de Devolución de Impuestos son papeles que la DIAN entrega a
    un contribuyente en vez de dinero cuando le debe una devolución. El
    contribuyente los usa para pagar impuestos, o los vende a otro que los
    use. Para la DIAN, un impuesto pagado con TIDIS cuenta como recaudo; para
    la Tesorería no entra un peso. Esa es la razón principal de que el recaudo
    bruto de la DIAN sea mayor que el recaudo efectivo del presupuesto.
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [recaudo-bruto]

regla-fiscal:
  termino: Regla fiscal
  corta: "La ley que le pone techo al déficit y a la deuda del Gobierno Nacional cada año."
  definicion: >-
    Es una norma, vigente desde 2011 y reformada en 2021, que obliga al
    Gobierno Nacional a cumplir cada año una meta de balance fiscal calculada
    para que la deuda no crezca sin límite. La vigila un comité técnico
    independiente, el Comité Autónomo de la Regla Fiscal (CARF), que emite
    conceptos pero no puede obligar. La regla tiene una cláusula de escape para
    situaciones extraordinarias.
  en_colombia: "El déficit proyectado para 2025, con la regla suspendida, era de 7,1 % del PIB."
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [clausula-de-escape, gnc]

clausula-de-escape:
  termino: Cláusula de escape
  corta: "El mecanismo que suspende la regla fiscal ante un evento extraordinario."
  definicion: >-
    Es la salida que la propia regla fiscal prevé para cuando pasa algo
    excepcional, como una pandemia o un desastre: el Gobierno puede dejar de
    cumplir las metas por un tiempo limitado, con concepto previo del CARF y
    aprobación del Consejo Superior de Política Fiscal. Se usó en 2020 y 2021
    por la pandemia. En junio de 2025 se activó de nuevo, por tres años, con
    concepto desfavorable del CARF, que no vio un evento extraordinario sino un
    desbalance fiscal.
  en_colombia: "Activada en junio de 2025 para 2025, 2026 y 2027."
  origen: /analisis/impuestos-y-deuda-2019-2026/
  ver: [regla-fiscal]

trm:
  termino: Tasa Representativa del Mercado (TRM)
  corta: "El precio oficial del dólar en Colombia: un promedio de lo que se negoció el día hábil anterior."
  definicion: >-
    Es el precio oficial del dólar en pesos. No lo fija nadie: es el promedio,
    ponderado por monto, de las operaciones de compra y venta de dólares que
    hicieron los bancos y demás intermediarios cambiarios durante el día hábil
    anterior. La calcula y certifica la Superintendencia Financiera y rige
    durante el día siguiente; por eso la TRM de hoy cuenta el mercado de ayer,
    y la del viernes vale hasta el lunes. Sirve de referencia para contratos,
    impuestos y contabilidad, y es la cifra que todo el mundo mira cuando
    pregunta «¿cómo está el dólar?». A corto plazo se mueve con las tasas de
    interés de aquí y de afuera y con el apetito de riesgo; a largo plazo,
    con la diferencia entre nuestra inflación y la de Estados Unidos.
  en_colombia: "$ 3.237,83 por dólar, vigente del 7 al 9 de noviembre de 2026; había tocado $ 3.349,63 el 29 de septiembre."
  origen: /video/depende-dolar/
  ver: [pesos-constantes]

iva:
  termino: Impuesto al valor agregado (IVA)
  corta: Impuesto que se paga al comprar bienes y servicios; el vendedor lo cobra y se lo entrega al Estado.
  definicion: >-
    Es un impuesto al consumo: se cobra como un porcentaje del precio cada vez
    que se vende un bien o un servicio, y quien lo termina pagando es el
    comprador final. Todos pagan la misma tarifa por el mismo producto, ganen
    lo que ganen, y por eso pesa más en los hogares que gastan casi todo su
    ingreso. Para aliviar ese efecto hay dos caminos: dejar los productos
    básicos sin IVA o con tarifa reducida, o cobrarlo y devolverles una parte a
    los hogares de menores ingresos.
  en_colombia: La tarifa general es de 19 %. Tras mantener la canasta básica sin IVA, el CARF estima que el IVA de la Ley de Rescate Económico dejaría entre $7,3 y $11,9 billones netos al año entre 2028 y 2030 (Pronunciamiento N.º 20, noviembre de 2026).
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [compensacion-del-iva, recaudo-bruto]

compensacion-del-iva:
  termino: Compensación del IVA
  corta: Devolución de parte del IVA a los hogares de menores ingresos.
  definicion: >-
    Es un mecanismo para corregir que el IVA pese más sobre quienes menos
    tienen. En lugar de dejar un producto sin impuesto para todos —también para
    los hogares de mayores ingresos—, se cobra el IVA y se les devuelve a los
    hogares de menores ingresos una suma que cubre lo que pagaron. Colombia lo
    aplica desde 2020 con el programa de Devolución del IVA.
  en_colombia: La Ley de Rescate Económico propone EfectIVA desde 2028, una devolución para 35 millones de personas (68 % de la población); el CARF estima su costo entre $16,7 y $22,9 billones al año (Pronunciamiento N.º 20, noviembre de 2026).
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [iva]

carf:
  termino: Comité Autónomo de la Regla Fiscal (CARF)
  corta: Organismo técnico e independiente que vigila el cumplimiento de la regla fiscal.
  definicion: >-
    Es un comité de expertos, independiente del Gobierno, creado por la Ley
    2155 de 2021 para hacerle seguimiento a la regla fiscal. Revisa las cuentas
    y proyecciones del Ministerio de Hacienda, hace las suyas y dice en público
    si cuadran. No decide ni tiene veto; su peso está en que sus
    pronunciamientos son técnicos y abiertos.
  en_colombia: En su Pronunciamiento N.º 20, del 23 de noviembre de 2026, calculó que sin ajuste la deuda neta del Gobierno llegaría a 91,2 % del PIB en 2030.
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [regla-fiscal, deficit-fiscal, deuda-neta]

deficit-fiscal:
  termino: Déficit fiscal
  corta: Lo que le falta al Gobierno en un año cuando gasta más de lo que recibe.
  definicion: >-
    Es la diferencia entre los gastos y los ingresos del Gobierno en un año,
    cuando los gastos son mayores. Incluye los intereses de la deuda, a
    diferencia del balance primario, que los deja por fuera. Lo que falta se
    cubre con deuda nueva, así que un déficit que se repite año tras año es
    deuda que crece.
  en_colombia: Fue de 6,4 % del PIB en 2025 para el Gobierno Nacional Central (dato preliminar del Ministerio de Hacienda, Actualización del Plan Financiero 2026).
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [balance-primario, gnc, recursos-de-credito]

calificacion-de-riesgo:
  termino: Calificación de riesgo
  corta: Nota que las agencias calificadoras le ponen a la deuda de un país según qué tan probable es que la pague.
  definicion: >-
    Es la opinión de una agencia calificadora —las más conocidas son S&P,
    Moody's y Fitch— sobre la capacidad de un gobierno para pagar su deuda a
    tiempo. Funciona como una escala de notas: por encima de cierto nivel la
    deuda tiene «grado de inversión» y por debajo se considera especulativa.
    Importa porque muchos fondos solo pueden comprar deuda con grado de
    inversión, y porque una nota más baja se traduce en intereses más altos.
  en_colombia: S&P y Fitch le retiraron a Colombia el grado de inversión en 2021.
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [deficit-fiscal]

gasto-publico:
  termino: Gasto público
  corta: Todo lo que gasta el Estado en un año, incluidos los intereses de la deuda.
  definicion: >-
    Es el total de lo que el Estado paga en un año: salarios y funcionamiento
    de las entidades, transferencias a salud, educación, pensiones y regiones,
    inversión, e intereses de la deuda. Si se le quitan los intereses queda el
    gasto primario, que es la parte que un gobierno decide en el presente.
  en_colombia: El gasto primario del Gobierno Nacional Central fue de 19,9 % del PIB en 2025; en 2005 era de 14,6 %.
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [gasto-primario, gnc]

deuda-neta:
  termino: Deuda bruta y deuda neta
  corta: La bruta es todo lo que el Gobierno debe; la neta le resta la plata que tiene en caja y otros activos financieros.
  definicion: >-
    La deuda bruta es el total de lo que el Gobierno debe. La deuda neta es esa
    misma cifra menos sus activos financieros, sobre todo la plata que tiene en
    caja y en cuentas: si debe 100 y tiene 8 guardados, su deuda bruta es 100 y
    la neta es 92. La regla fiscal colombiana se mide con la deuda neta, y por
    eso es la que usa el CARF. Ninguna de las dos es una deuda «sin intereses»:
    los intereses no hacen parte del saldo, son lo que se paga cada año por
    tenerlo.
  en_colombia: Sin ajuste fiscal, la deuda neta del Gobierno Nacional Central pasaría de 60,2 % del PIB en 2026 a 91,2 % en 2030; con la Ley de Rescate Económico llegaría a 78,1 % (CARF, Pronunciamiento N.º 20, noviembre de 2026).
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [intereses-de-la-deuda, regla-fiscal, gnc]

intereses-de-la-deuda:
  termino: Intereses de la deuda
  corta: Lo que el Gobierno paga cada año por tener deuda; no reduce lo que debe.
  definicion: >-
    Son el costo anual de la deuda: lo que el Gobierno les paga a quienes le
    prestaron, sin contar la devolución del préstamo. Pagarlos no baja el saldo
    de la deuda, igual que pagar solo los intereses de una tarjeta no reduce lo
    que se debe. Cuando las cuentas se miran «sin intereses» se está hablando
    del balance primario, que compara ingresos y gastos dejando ese pago por
    fuera; no existe una «deuda sin intereses». Entre más alta la deuda y peor
    la calificación de riesgo, más intereses se pagan y menos queda para todo
    lo demás.
  en_colombia: Sin ajuste fiscal, el gasto en intereses llegaría a cerca de la mitad de los ingresos tributarios hacia 2030 (CARF, Pronunciamiento N.º 20, noviembre de 2026).
  origen: /analisis/optimistas-o-cansados-discusion-fiscal/
  ver: [balance-primario, deuda-neta, calificacion-de-riesgo]
